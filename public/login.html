<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniReserve – Login</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="login-container" style="max-width: 440px; margin: 3.5rem auto; padding: 2rem; background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border-color);">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <div style="font-size: 2.2rem; margin-bottom: 0.25rem;">🏛️</div>
      <h2 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.25rem;">UniReserve Hub</h2>
      <p style="font-size: 0.8rem; color: var(--text-muted);">Campus Resource Booking & Authorization System</p>
    </div>

    <form id="login-form">
      <div class="form-group" style="margin-bottom: 1rem;">
        <label for="username">Username</label>
        <input type="text" id="username" class="form-control" placeholder="e.g. admin, faculty, student, viewer" required />
      </div>
      <div class="form-group" style="margin-bottom: 1.25rem;">
        <label for="password">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.65rem;">Log In</button>
    </form>

    <div id="error-msg" style="color: #f43f5e; margin-top: 0.75rem; display: none; text-align: center; font-size: 0.85rem; font-weight: 600;"></div>

    <!-- Demo Accounts Quick Fill -->
    <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color);">
      <div style="font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; margin-bottom: 0.6rem; text-align: center;">
        Quick Select Demo Role
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; font-size: 0.75rem;">
        <button type="button" class="btn btn-secondary" onclick="quickFill('admin', 'admin123')" style="padding: 0.4rem; text-align: left; font-size: 0.72rem;">
          🏛️ <strong>Admin</strong><br><small style="color: var(--text-muted);">admin / admin123</small>
        </button>
        <button type="button" class="btn btn-secondary" onclick="quickFill('faculty', 'fac123')" style="padding: 0.4rem; text-align: left; font-size: 0.72rem;">
          👨‍🏫 <strong>Faculty / HOD</strong><br><small style="color: var(--text-muted);">faculty / fac123</small>
        </button>
        <button type="button" class="btn btn-secondary" onclick="quickFill('student', 'stud123')" style="padding: 0.4rem; text-align: left; font-size: 0.72rem;">
          🎓 <strong>Student Lead</strong><br><small style="color: var(--text-muted);">student / stud123</small>
        </button>
        <button type="button" class="btn btn-secondary" onclick="quickFill('viewer', 'view123')" style="padding: 0.4rem; text-align: left; font-size: 0.72rem;">
          👀 <strong>Viewer (Read-Only)</strong><br><small style="color: var(--text-muted);">viewer / view123</small>
        </button>
      </div>
    </div>
  </div>

  <script>
    const demoUsers = {
      admin:   { password: 'admin123', role: 'admin' },
      faculty: { password: 'fac123',   role: 'faculty' },
      student: { password: 'stud123',  role: 'student' },
      viewer:  { password: 'view123',  role: 'viewer' }
    };

    function quickFill(user, pass) {
      document.getElementById('username').value = user;
      document.getElementById('password').value = pass;
      document.getElementById('login-form').dispatchEvent(new Event('submit'));
    }

    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const user = demoUsers[username];
      if (user && user.password === password) {
        const token = btoa(`${username}:${user.role}`);
        localStorage.setItem('authToken', token);
        localStorage.setItem('userRole', user.role);
        localStorage.setItem('userName', username);
        window.location.href = '/index.html';
      } else {
        const err = document.getElementById('error-msg');
        err.textContent = 'Invalid credentials. Please select one of the demo users above.';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
